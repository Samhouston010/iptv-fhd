name: Update FHD Playlist

on:
  schedule:
    - cron: '0 3 * * *'   # every day at 3:00 UTC
  workflow_dispatch:        # manual trigger

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ensure ffmpeg is installed
        run: command -v ffprobe || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Update playlist
        run: python update.py

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fhd_channels.m3u README.md
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "Auto-update: $(date -u '+%Y-%m-%d') — $(grep -c '^http' fhd_channels.m3u) channels"
          git push
